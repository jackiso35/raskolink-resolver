name: RaskoLink Browser Resolver

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      RASKOLINK_FEED_URL: ${{ secrets.RASKOLINK_FEED_URL }}
      RASKOLINK_CALLBACK_URL: ${{ secrets.RASKOLINK_CALLBACK_URL }}
      RASKOLINK_RESOLVER_KEY: ${{ secrets.RASKOLINK_RESOLVER_KEY }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright package
        run: npm install --no-audit --no-fund
      - name: Resolve due shortlinks
        run: node resolver.js
